name: Display tools

on:
  pull_request:
    paths:
      - "tools/compact_display/**"
      - ".github/workflows/display-tools.yml"
  push:
    branches:
      - main
    paths:
      - "tools/compact_display/**"
      - ".github/workflows/display-tools.yml"

permissions:
  contents: read

concurrency:
  group: display-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compact-display:
    # Host-side consistency only: panel definitions vs the vendor overlay,
    # generated overlays compile, scripts pass shellcheck. Not bench evidence.
    name: Compact display - panels, overlays, scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install device-tree compiler and shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q device-tree-compiler shellcheck

      - name: Unit tests
        run: python3 -m unittest -v tools/compact_display/test_compact_display.py

      - name: Four-inch A source preflight unit tests (synthetic; no kernel compile)
        run: python3 -m unittest -v tools/compact_display/test_preflight_4in.py

      - name: Four-inch A source audit against immutable upstream driver (no kernel compile)
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/raspberrypi/linux/97b5af2dde50c0acace6d406208dec3fc8dfe888/drivers/gpu/drm/panel/panel-waveshare-dsi-v2.c \
            -o /tmp/panel-waveshare-dsi-v2.c
          test "$(git hash-object /tmp/panel-waveshare-dsi-v2.c)" = c6cc003a35337971eef670587b200928ca1c1814
          python3 tools/compact_display/preflight_4in.py --driver /tmp/panel-waveshare-dsi-v2.c

      - name: Temporary format diagnosis for new Python files
        run: |
          python3 -m pip install -q ruff==0.12.10
          ruff format --diff tools/compact_display/preflight_4in.py tools/compact_display/test_preflight_4in.py || true

      - name: Dry-run installer (generate + compile both panels)
        run: |
          tools/compact_display/install_panel.sh --dry-run \
            tools/compact_display/panels/waveshare-3in5-dsi-h.panel /tmp/h
          tools/compact_display/install_panel.sh --dry-run \
            tools/compact_display/panels/waveshare-3in5-dsi-e.panel /tmp/e
          fdtdump /tmp/h/overlay.dtbo | grep -q 'platypus,waveshare-3in5-dsi-h'

      - name: Shellcheck
        working-directory: tools/compact_display
        run: shellcheck -x -s sh install_panel.sh restore_5in.sh bench_accept.sh lib/common.sh
