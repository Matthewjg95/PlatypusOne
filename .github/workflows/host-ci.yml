name: Host CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: host-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows / MSVC
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install format tools
        run: python -m pip install --disable-pip-version-check clang-format==18.1.8 ruff==0.12.10

      - name: Check changed C++ formatting
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:BASE_SHA
          if (-not $base -or $base -match '^0+$') {
              $base = 'HEAD^'
          }

          $files = @(git diff --name-only --diff-filter=ACMR $base HEAD -- '*.cpp' '*.cc' '*.cxx' '*.h' '*.hpp')
          if ($files.Count -gt 0) {
              & clang-format --dry-run --Werror @files
              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }

      - name: Check Python lint and formatting
        shell: pwsh
        run: |
          $files = @(git ls-files '*.py')
          if ($files.Count -gt 0) {
              & ruff check @files
              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }

              & ruff format --check @files
              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }

      - name: Configure host build
        run: >
          cmake
          -S .
          -B build
          -DPLATYPUS_TARGET_HOST=ON
          -DPLATYPUS_BUILD_APPS=ON
          -DPLATYPUS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  linux-gcc:
    # The UNO Q runs Debian: this job is the closest CI stand-in for the
    # target, and the only build that compiles the UNIX-only code at all
    # (V4l2Camera, UnoQBoard/SerialMcuBridge, POSIX transports).
    name: Linux / GCC
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure host build
        run: >
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPLATYPUS_TARGET_HOST=ON
          -DPLATYPUS_BUILD_APPS=ON
          -DPLATYPUS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test Scout kiosk (synthetic, offscreen)
        run: |
          mkdir -p build/kiosk-smoke/screens
          ./build/tools/scout_kiosk/scout_kiosk --fake \
            --offscreen build/kiosk-smoke/screens \
            --out build/kiosk-smoke/observations
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/kiosk-smoke")
          scan = root / "observations/scan-0001"
          record = json.loads((scan / "observation.json").read_text())
          assert record["source"]["camera"] == "synthetic"
          assert record["source"]["camera_identity"] == "synthetic"
          assert record["source"]["pixel_format"] == "yuyv"
          assert record["derived"], "no measurement evidence saved"
          assert record["unresolved"], "unsupported fields must stay unresolved"
          image = next(a for a in record["artifacts"] if a["id"] == "source-image")
          assert (scan / image["path"]).stat().st_size == 640 * 480 * 2
          for name in ("preview.ppm", "card.ppm"):
              data = (root / "screens" / name).read_bytes()
              header = b"P6\n800 480\n255\n"
              assert data.startswith(header)
              assert len(data) == len(header) + 800 * 480 * 3
          print("synthetic kiosk: source + JSON + preview + card preserved")
          PY

      - name: Smoke-test Scout kiosk portrait layout (480x800, compact display)
        run: |
          mkdir -p build/kiosk-portrait/screens
          ./build/tools/scout_kiosk/scout_kiosk --fake --offscreen-size 480x800 \
            --offscreen build/kiosk-portrait/screens \
            --out build/kiosk-portrait/observations
          for name in preview.ppm card.ppm; do
            head -c 15 "build/kiosk-portrait/screens/$name" | grep -q '480 800' \
              || { echo "$name is not 480x800"; exit 1; }
          done
