name: Host CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: host-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows / MSVC
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install format tools
        run: python -m pip install --disable-pip-version-check clang-format==18.1.8 ruff==0.12.10

      - name: Check changed C++ formatting
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base = $env:BASE_SHA
          if (-not $base -or $base -match '^0+
          cmake
          -S .
          -B build
          -DPLATYPUS_TARGET_HOST=ON
          -DPLATYPUS_BUILD_APPS=ON
          -DPLATYPUS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
) {
              $base = 'HEAD^'
          }

          $files = @(git diff --name-only --diff-filter=ACMR $base HEAD -- '*.cpp' '*.cc' '*.cxx' '*.h' '*.hpp')
          if ($files.Count -gt 0) {
              & clang-format --dry-run --Werror @files
              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }

      - name: Check Python lint and formatting
        shell: pwsh
        run: |
          $files = @(git ls-files '*.py')
          if ($files.Count -gt 0) {
              & ruff check @files
              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }

              & ruff format --check @files
              if ($LASTEXITCODE -ne 0) {
                  exit $LASTEXITCODE
              }
          }

      - name: Configure host build
        run: >
          cmake
          -S .
          -B build
          -DPLATYPUS_TARGET_HOST=ON
          -DPLATYPUS_BUILD_APPS=ON
          -DPLATYPUS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
