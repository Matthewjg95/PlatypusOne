<text x='610.00' y='732.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>shunt   J2-1 GND &lt;-&gt; J2-2 SPI/I2C (on the carrier, no wire to the UNO Q)</text>
<text x='610.00' y='750.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#c77700' text-anchor='start' font-weight='normal'>Colours are the Qwiic convention (SparkFun, Adafruit #4397); VERIFY by</text>
<text x='610.00' y='768.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#c77700' text-anchor='start' font-weight='normal'>continuity at Gate B - a third-party cable may differ.</text>
