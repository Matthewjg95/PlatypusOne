<text x='510.00' y='622.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>pin tails point DOWN -&gt; female jumper sockets connect underneath</text>
<rect x='120.00' y='680.00' width='760.00' height='156.00' rx='0' fill='#fafafa' stroke='#bbb' stroke-width='1.0' opacity='1.0'/>
<text x='130.00' y='702.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>SOLDER: full 1x9 + 1x4 straight 0.1 in male headers (13 joints). Headers are NOT included.</text>
<text x='130.00' y='720.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>JUMPER: 2-pin 0.1 in shunt across J2-1 GND and J2-2 SPI/I2C -&gt; I2C mode.</text>
<text x='130.00' y='738.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#555' text-anchor='start' font-weight='normal'>   (default is SPI: the pin is pulled high on the carrier; Pololu suggests this shunt)</text>
<text x='130.00' y='756.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#b00020' text-anchor='start' font-weight='normal'>NEVER connect power to J1-1 CORE/IOVDD or J1-2 AVDD: regulator OUTPUTS.</text>
<text x='130.00' y='774.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#b00020' text-anchor='start' font-weight='normal'>   They are adjacent to J1-3 VIN - the most likely off-by-one wiring error.</text>
<text x='130.00' y='792.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>Leave MISO, CS, INT, LP, SYNC unconnected (LP pulled high = I2C enabled).</text>
<text x='130.00' y='810.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#555' text-anchor='start' font-weight='normal'>Keep the protective liner on while soldering; remove it before ranging.</text>
<text x='130.00' y='828.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#c77700' text-anchor='start' font-weight='normal'>Sensor body position is approximate (photo), not a dimension.</text>
</svg>
