<text x='650.00' y='112.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>Gate B - unpowered (board OFF, USB-C and DC_IN removed, cable fitted):</text>
<text x='650.00' y='130.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>B1  Qwiic pin 1 GND  &lt;-&gt;  J1-4 GND          expect continuity</text>
<text x='650.00' y='148.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>B2  Qwiic pin 2 3V3  &lt;-&gt;  J1-3 VIN          expect continuity</text>
<text x='650.00' y='166.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>B3  Qwiic pin 3 SDA  &lt;-&gt;  J1-5 SDA          expect continuity</text>
<text x='650.00' y='184.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>B4  Qwiic pin 4 SCL  &lt;-&gt;  J1-6 SCL          expect continuity</text>
<text x='650.00' y='202.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>B5  J2-2 SPI/I2C     &lt;-&gt;  J2-1 GND          expect ~0 ohm (shunt)</text>
<text x='650.00' y='220.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>B6  VIN-GND, SDA-GND, SCL-GND, SDA-SCL       NOT a short; record ohms</text>
<text x='650.00' y='238.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>B7  each adjacent pin pair on J1 and J2      no solder bridge (visual + ohms)</text>
<text x='650.00' y='256.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>B8  J1-3 VIN &lt;-&gt; J1-2 AVDD and J1-1 CORE     NOT shorted (different nets)</text>
<text x='650.00' y='274.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#555' text-anchor='start' font-weight='normal'>    Through-IC readings drift as caps charge: record, don&#x27;t force a pass.</text>
<text x='650.00' y='292.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'></text>
<text x='650.00' y='310.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>Gate C - powered (operator measures; ToF idle first, then ranging):</text>
<text x='650.00' y='328.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>V1  VIN - GND          &gt;= 3.20 V (Pololu min) ; UNO Q rail spec 3.1-3.5 V</text>
<text x='650.00' y='346.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#b00020' text-anchor='start' font-weight='normal'>V2  AVDD - GND         &gt;= 3.13 V (DS14161 min) - most critical, re-check while ranging</text>
<text x='650.00' y='364.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>V3  CORE/IOVDD - GND   1.62-1.98 V (DS14161)</text>
<text x='650.00' y='382.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>V4  SDA idle - GND     ~ VIN (pulled up both sides)</text>
<text x='650.00' y='400.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>V5  SCL idle - GND     ~ VIN</text>
<text x='650.00' y='418.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>V6  SPI/I2C - GND      ~ 0 V (shunt present)</text>
<text x='650.00' y='436.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#111' text-anchor='start' font-weight='normal'>V7  LP - GND           ~ VIN (pulled high = I2C enabled)</text>
<text x='650.00' y='454.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#b00020' text-anchor='start' font-weight='normal'>Do not probe adjacent pins with bare tips while powered: a slip shorts</text>
<text x='650.00' y='472.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#b00020' text-anchor='start' font-weight='normal'>CORE/AVDD/VIN. Use a hooked probe or the female-socket side.</text>
<text x='80.00' y='580.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='12' fill='#111' text-anchor='start' font-weight='bold'>UNO Q QWIIC1 (top side, schematic) - probe from the cable&#x27;s female-socket ends</text>
