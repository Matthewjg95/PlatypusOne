<text x='181.00' y='674.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='10' fill='#111' text-anchor='middle' font-weight='normal'>SCL</text>
<text x='240.00' y='620.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#555' text-anchor='start' font-weight='normal'>Do not push meter probes into the 1 mm Qwiic receptacle;</text>
<text x='240.00' y='638.00' font-family='DejaVu Sans, Arial, sans-serif' font-size='11' fill='#555' text-anchor='start' font-weight='normal'>measure at the cable&#x27;s other end or the Pololu pins.</text>
