<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <rect width="1600" height="950" fill="#f7f8fb"/>
  <style>
    .title{font:700 42px Arial,sans-serif;fill:#14213d}.sub{font:400 22px Arial,sans-serif;fill:#4b5563}
    .h{font:700 24px Arial,sans-serif;fill:#111827}.t{font:400 20px Arial,sans-serif;fill:#1f2937}
    .s{font:400 17px Arial,sans-serif;fill:#4b5563}.box{fill:#fff;stroke:#334155;stroke-width:3;rx:18}
    .fabric{fill:#eef2ff;stroke:#4338ca;stroke-width:4;rx:20}.mss{fill:#ecfeff;stroke:#0f766e;stroke-width:4;rx:20}
    .bench{fill:#fff7ed;stroke:#c2410c;stroke-width:3;rx:18}.arrow{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#a)}
    .dash{stroke:#64748b;stroke-width:3;fill:none;stroke-dasharray:9 8;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs>

  <text x="800" y="62" text-anchor="middle" class="title">Platypus Reflex</text>
  <text x="800" y="98" text-anchor="middle" class="sub">Deterministic Sensor Fusion &amp; Event Processing — PolarFire SoC Icicle Kit</text>

  <rect x="55" y="160" width="310" height="545" class="box"/>
  <text x="210" y="205" text-anchor="middle" class="h">Physical Inputs</text>
  <rect x="90" y="245" width="240" height="78" class="bench"/><text x="210" y="282" text-anchor="middle" class="t">IMU</text><text x="210" y="307" text-anchor="middle" class="s">SPI / I²C</text>
  <rect x="90" y="345" width="240" height="78" class="bench"/><text x="210" y="382" text-anchor="middle" class="t">ToF Range</text><text x="210" y="407" text-anchor="middle" class="s">I²C / digital</text>
  <rect x="90" y="445" width="240" height="78" class="bench"/><text x="210" y="482" text-anchor="middle" class="t">Encoder / Events</text><text x="210" y="507" text-anchor="middle" class="s">GPIO / counter</text>
  <rect x="90" y="545" width="240" height="78" class="bench"/><text x="210" y="582" text-anchor="middle" class="t">Power / Current</text><text x="210" y="607" text-anchor="middle" class="s">telemetry</text>
  <text x="210" y="665" text-anchor="middle" class="s">Expansion I/O / adapters</text>

  <rect x="450" y="150" width="470" height="575" class="fabric"/>
  <text x="685" y="198" text-anchor="middle" class="h">PolarFire FPGA Fabric</text>
  <rect x="500" y="235" width="370" height="70" class="box"/><text x="685" y="278" text-anchor="middle" class="t">Deterministic Acquisition</text>
  <rect x="500" y="325" width="370" height="70" class="box"/><text x="685" y="368" text-anchor="middle" class="t">Hardware Timestamping</text>
  <rect x="500" y="415" width="370" height="70" class="box"/><text x="685" y="458" text-anchor="middle" class="t">Filter / Feature Extraction</text>
  <rect x="500" y="505" width="370" height="70" class="box"/><text x="685" y="548" text-anchor="middle" class="t">Synchronize / Detect Events</text>
  <rect x="500" y="595" width="370" height="85" class="box"/><text x="685" y="632" text-anchor="middle" class="t">Observation Buffer</text><text x="685" y="660" text-anchor="middle" class="s">timestamp + source + features + flags</text>

  <rect x="1005" y="150" width="530" height="575" class="mss"/>
  <text x="1270" y="198" text-anchor="middle" class="h">RISC-V Microprocessor Subsystem</text>
  <text x="1270" y="228" text-anchor="middle" class="s">PolarFire SoC Icicle Kit — Embedded Linux</text>
  <rect x="1060" y="270" width="420" height="75" class="box"/><text x="1270" y="315" text-anchor="middle" class="t">Configuration &amp; Control</text>
  <rect x="1060" y="365" width="420" height="75" class="box"/><text x="1270" y="410" text-anchor="middle" class="t">Logging / Storage / Networking</text>
  <rect x="1060" y="460" width="420" height="75" class="box"/><text x="1270" y="505" text-anchor="middle" class="t">Visualization / User Interface</text>
  <rect x="1060" y="555" width="420" height="75" class="box"/><text x="1270" y="600" text-anchor="middle" class="t">Analytics / Higher-Level Logic</text>
  <text x="1270" y="677" text-anchor="middle" class="s">LPDDR4 • eMMC • Dual Ethernet • PCIe • CAN</text>

  <path d="M365 435 L450 435" class="arrow"/>
  <text x="408" y="417" text-anchor="middle" class="s">sensor data</text>
  <path d="M920 415 L1005 415" class="arrow"/>
  <text x="962" y="378" text-anchor="middle" class="s">FIC / AXI</text>
  <text x="962" y="401" text-anchor="middle" class="s">observations</text>
  <path d="M1005 500 L920 500" class="dash"/>
  <text x="962" y="535" text-anchor="middle" class="s">config / thresholds</text>

  <rect x="245" y="780" width="1110" height="110" class="box"/>
  <text x="800" y="818" text-anchor="middle" class="h">Measured Contest Demonstration</text>
  <text x="800" y="853" text-anchor="middle" class="t">CPU-only baseline  ↔  FPGA-assisted path under controlled Linux load</text>
  <text x="800" y="882" text-anchor="middle" class="s">latency • jitter • dropped samples • throughput • CPU utilization • board-level power</text>

  <path d="M685 725 L685 780" class="arrow"/>
  <path d="M1270 725 L1270 780" class="arrow"/>
</svg>